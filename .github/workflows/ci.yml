name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:wrangler
      - run: node --test tests/anchors.test.ts
      - run: node --test tests/model-plane.test.ts

  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The model plane's freshness gate (TODO.ai-platform/05): the index
      # derives from the smart repo's committed model-plane bundles — the
      # gate compares the pinned hashes against the checkout's current
      # bundles (a package change re-indexes).
      - uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          ref: v2
          path: smart-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ingest/requirements.txt
      - run: python -m compileall -q ingest
      - run: SMART_REPO="$GITHUB_WORKSPACE/smart-checkout" python -m ingest.cli model-plane --check

  site-and-ui:
    # builds the site for real (site-shell checked out as the sibling the
    # file: dependency expects) and runs the Playwright UI suite against
    # the built bundle with stubbed APIs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: oimlsmart/site-shell
          path: site-shell-checkout
          token: ${{ secrets.SITE_SHELL_TOKEN || github.token }}
      - name: place site-shell where the file dependency expects it
        run: ln -s "$GITHUB_WORKSPACE/site-shell-checkout" "../site-shell"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run site:build
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui.mjs

  e2e:
    # Manual/nightly only — hits the live service and spends quota.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:e2e
        env:
          BASE_URL: ${{ vars.E2E_BASE_URL || 'https://ai.oimlsmart.org' }}
          RAG_API_KEY: ${{ secrets.RAG_API_KEY }}
