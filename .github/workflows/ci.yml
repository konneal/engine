name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dist freshness (committed build output must match source)
        run: |
          npm install --silent
          npm run build >/dev/null 2>&1
          git diff --exit-code dist || (echo "dist/ is stale — rebuild and commit (npm run build)"; exit 1)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:wrangler
      - run: npm run test:units

  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The model plane's freshness gate (TODO.ai-platform/05): the index
      # derives from the smart repo's committed model-plane bundles — the
      # gate compares the pinned hashes against the checkout's current
      # bundles (a package change re-indexes). The smart repo is PRIVATE:
      # the checkout rides SMART_REPO_TOKEN, else the org CI account's
      # OIMLSMART_CI_PAT_TOKEN; with neither it SKIPS HONESTLY (visible,
      # never a silent pass).
      - id: smart-checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: oimlsmart/smart
          ref: v2
          path: smart-checkout
          token: ${{ secrets.SMART_REPO_TOKEN || secrets.OIMLSMART_CI_PAT_TOKEN || github.token }}
      - if: steps.smart-checkout.outcome != 'success'
        run: 'echo "model-plane freshness: SKIP — the smart checkout needs SMART_REPO_TOKEN or OIMLSMART_CI_PAT_TOKEN declared; the gate binds once declared"'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ingest/requirements.txt pytest ruff
      - run: python -m compileall -q ingest
      - run: python -m pytest tests/python -q
      - run: python -m ruff check --select F ingest/
      - if: steps.smart-checkout.outcome == 'success'
        run: SMART_REPO="$GITHUB_WORKSPACE/smart-checkout" python -m ingest.cli model-plane --check

