name = "rag-public"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Route: custom domain on the oimlsmart.org zone (OIML SMART account).
routes = [
  { pattern = "ai.oimlsmart.org", custom_domain = true }
]


[assets]
directory = "../../site/dist"
binding = "ASSETS"
run_worker_first = ["/", "/api/"]

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "idx_oiml_public_v2"

[[kv_namespaces]]
binding = "CACHE"
id = "0f65d12cc77c41b5b91086de1c04f6da"

[[d1_databases]]
binding = "DB"
database_name = "rag-public"
database_id = "655cd63f-1826-4161-bfd1-90c584add4ce"

[vars]
INDEX_VERSION = "public-v2.39"
ANON_DAY_ASK = "20"
ANON_DAY_SEARCH = "50"
KEY_DAY_ASK_DEFAULT = "2000"
ANON_DAY_HARD_CAP = "5000"
MEMBER_DAY_ASK = "300"
EXEMPT_IPS = "218.188.43.254"
OIDC_ISSUER = "https://id.oimlsmart.org"
OIDC_REDIRECT_URI = "https://ai.oimlsmart.org/auth/callback"
OIDC_CLIENT_ID = "oiml-rag"

[observability]
enabled = true
