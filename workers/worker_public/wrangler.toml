name = "rag-public"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# Route: custom domain on the oimlsmart.org zone (OIML SMART account).
routes = [
  { pattern = "ai.oimlsmart.org", custom_domain = true }
]


[assets]
directory = "./public"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "idx_oiml_public"

[[kv_namespaces]]
binding = "CACHE"
id = "0f65d12cc77c41b5b91086de1c04f6da"

[[d1_databases]]
binding = "DB"
database_name = "rag-public"
database_id = "655cd63f-1826-4161-bfd1-90c584add4ce"

[vars]
INDEX_VERSION = "public-v1"
ANON_DAY_ASK = "20"
ANON_DAY_SEARCH = "50"
KEY_DAY_ASK_DEFAULT = "2000"
ANON_DAY_HARD_CAP = "5000"

[observability]
enabled = true
