name = "rag-public"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Prompts are DATA (workers/worker_public/prompts/*.md), imported into the
# bundle as text — edited as content, never as code.
[[rules]]
type = "Text"
globs = ["**/*.md"]

# Route: custom domain on the oimlsmart.org zone (OIML SMART account).
routes = [
  { pattern = "ai.oimlsmart.org", custom_domain = true }
]


[assets]
directory = "../../site/dist"
binding = "ASSETS"
run_worker_first = ["/", "/api/"]

[ai]
binding = "AI"

# Figure/image assets for answer contract v2 (TODO.remaining/03) — served
# at /assets/u/<unit>.<ext> with immutable caching; keys are unit-keyed.
[[r2_buckets]]
binding = "UNIT_ASSETS"
bucket_name = "rag-public-assets"

[[vectorize]]
binding = "VECTORIZE"
index_name = "idx_oiml_public_v2"

# Comparison lanes (TODO.model-rag): the annealment experiment indexes
[[vectorize]]
binding = "EXP_PRIMMEL"
index_name = "idx_exp_primmel"

[[vectorize]]
binding = "EXP_COMPOSED"
index_name = "idx_exp_composed"

[[vectorize]]
binding = "EXP_PLAIN"
index_name = "idx_exp_plain"

[[vectorize]]
binding = "EXP_ADC"
index_name = "idx_exp_adoc"

[[vectorize]]
binding = "EXP_MKO"
index_name = "idx_exp_mko"

[[vectorize]]
binding = "EXP_PFLAT"
index_name = "idx_exp_primmel_flat"

# The vocabulary lane (L2 nomenclature bridge): defined terms + definitions
[[vectorize]]
binding = "GLOSSARY"
index_name = "idx_glossary"

[[d1_databases]]
binding = "EXP_DB"
database_name = "rag-comparison"
database_id = "85a1fa04-ef61-4a2d-8e85-23bbc0a3284d"

[[kv_namespaces]]
binding = "CACHE"
id = "0f65d12cc77c41b5b91086de1c04f6da"

[[d1_databases]]
binding = "DB"
database_name = "rag-public"
database_id = "655cd63f-1826-4161-bfd1-90c584add4ce"

# Service binding: rag-public delegates federated retrieval to rag-internal
# for users with internal roles. rag-public itself holds NO binding to the
# internal Vectorize index — isolation is structural (CLAUDE.md).
[[services]]
binding = "INTERNAL_SERVICE"
service = "rag-internal"

[vars]
INDEX_VERSION = "public-v2.83-citelabels"
ANON_DAY_ASK = "20"
ANON_DAY_SEARCH = "50"
KEY_DAY_ASK_DEFAULT = "2000"
ANON_DAY_HARD_CAP = "5000"
MEMBER_DAY_ASK = "300"
OIDC_ISSUER = "https://id.oimlsmart.org"
OIDC_REDIRECT_URI = "https://ai.oimlsmart.org/auth/callback"
OIDC_CLIENT_ID = "oiml-rag"
# TODO.ai-platform/03 — the "my account" live-data delegation: the platform
# the assistant reads AS the user (the RFC 8693 exchange's scope target).
# Absent/blank → the account chip answers live-unavailable honestly.
SMART_PLATFORM_API = "https://demo.oimlsmart.org"
SMART_PLATFORM_CLIENT_ID = "oiml-smart"

[observability]
enabled = true
