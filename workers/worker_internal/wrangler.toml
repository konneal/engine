name = "rag-internal"
main = "src/index.ts"
compatibility_date = "2024-09-23"
account_id = "06cad8ae9a017c856ab496c6bca9a9d8"

[observability]
enabled = true

[[vectorize]]
binding = "PUBLIC"
index_name = "idx_oiml_public_v2"

[[vectorize]]
binding = "INTERNAL"
index_name = "idx_iso_internal"

[ai]
binding = "AI"

[[kv_namespaces]]
id = "0f65d12cc77c41b5b91086de1c04f6da"
binding = "CACHE"

[vars]
INDEX_VERSION = "internal-v2-retrieve-only"
SESSION_SECRET_SET = "true"

# deploy on internal.oimlsmart.org (custom domain)
routes = [
  { pattern = "internal.oimlsmart.org", custom_domain = true }
]
workers_dev = true
